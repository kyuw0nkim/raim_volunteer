<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>아뜰리에 관리 보드</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"><style>
:root{color-scheme:light;
  --bg:#F4F6FA;--surface:#FFFFFF;--sunk:#E9EDF4;--ink:#16203A;--muted:#5C6780;--line:#D9DFEA;
  --accent:#2450D6;--accent-ink:#FFFFFF;--accent-soft:#E4EAFB;
  --danger:#C23A2E;--danger-soft:#FBE8E5;--warn:#9A5B00;--warn-soft:#FFF1D6;--ok:#1C7447;--ok-soft:#E1F2E8;
  --closed:#A6AEBF;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:grid;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)}

.crumb{font-size:12.5px;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.top-r{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.save{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save[data-s="pending"] i,.save[data-s="saving"] i{background:var(--warn)}
.save[data-s="error"] i{background:var(--danger)}
.save button{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.me{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px}
.me b{font-weight:700}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start}
.card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.stack{display:grid;gap:16px;align-content:start}
.empty{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.flagon{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.btn.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{padding:9px 16px;font-size:14px}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline}

.pill{font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.late{background:var(--danger);color:#fff}
.pill.today,.pill.flag{background:var(--danger-soft);color:var(--danger)}
.pill.soon,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--sunk);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}

/* routine tasks */
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--sunk);border-left:4px solid var(--tc,transparent)}
.task[data-s="late"],.task[data-s="today"],.task[data-s="flag"]{--tc:var(--danger)}
.task[data-s="soon"],.task[data-s="warn"]{--tc:var(--warn)}
.task[data-s="done"]{--tc:var(--ok)}
.task .t-name{font-weight:700;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.task .t-sub{font-size:12.5px;color:var(--muted);grid-column:1}
.task .t-act{grid-row:1/3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task details{grid-column:1/-1;font-size:12.5px}
.task details summary{cursor:pointer;color:var(--accent)}
.task details p{margin:4px 0 0;white-space:pre-wrap;color:var(--ink)}
@media (max-width:560px){.task{grid-template-columns:1fr}.task .t-act{grid-row:auto;grid-column:1;justify-content:flex-start}}

/* checklists */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.checks{grid-template-columns:1fr}}
.cl{display:grid;gap:4px;align-content:start}
.cl h3{margin:0 0 2px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.cl h3 span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cl h3 span.all{color:var(--ok)}
.cl label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--sunk);font-size:13px;cursor:pointer}
.cl label.on{background:var(--ok-soft)}
.cl label input{margin:0;accent-color:var(--ok);width:17px;height:17px;flex:none}
.cl label em{font-style:normal;margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.cl .allbtn{justify-self:start}

/* mini lists */
.mini{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.mini li{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:13px;padding:5px 8px;border-radius:6px;background:var(--sunk)}
.mini li span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.mini li.low span:last-child{color:var(--danger);font-weight:500}

/* calendar */
.cal{display:grid;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h strong{font-size:15px}
.cal-h button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:30px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;text-align:center;color:var(--muted)}
.wd.sun{color:var(--danger)}.wd.sat{color:var(--accent)}
.cell{border:1px solid transparent;background:var(--sunk);border-radius:7px;min-height:74px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell .n{font-family:var(--mono);font-size:12px}
.cell.sun .n{color:var(--danger)}.cell.sat .n{color:var(--accent)}
.cell.today{border-color:var(--ink)}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cell.closed{background:transparent;border:1px dashed var(--line)}
.cell.closed .n{color:var(--closed)}
.cell.pad{visibility:hidden}
.cell .ev{font-size:10.5px;line-height:1.3;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.d{background:var(--ok-soft);color:var(--ok)}
.ev.p{border:1px dashed var(--muted);color:var(--muted)}
.ev.p.late{border-color:var(--danger);color:var(--danger)}
.ev.i{background:var(--warn-soft);color:var(--warn)}
.ev.more{color:var(--muted)}
.cell .ck{font-size:10px;color:var(--muted);margin-top:auto}
.cell .ck.all{color:var(--ok)}
@media (max-width:560px){.cell{min-height:56px}.cell .ev{font-size:9.5px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend .ev{display:inline-block;font-size:11px}
.day h3{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.rowline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:7px;background:var(--sunk)}
.rowline .grow{flex:1;min-width:0}
.rowline .s{color:var(--muted);font-size:12px}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}

/* stock */
.stock{display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(120px,1.4fr) auto minmax(70px,.5fr) minmax(90px,.8fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--sunk)}
.item.low{background:var(--danger-soft)}
.item input.nm{font-weight:700}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.step button{border:0;background:none;width:34px;height:34px;font-size:17px}
.step input{width:64px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-family:var(--mono);font-size:14px;height:34px}
.step span{padding:0 8px 0 4px;font-size:12px;color:var(--muted)}
.item .lab{font-size:11px;color:var(--muted);display:grid;gap:2px}
@media (max-width:760px){.item{grid-template-columns:1fr auto}.item .f-nm{grid-column:1/-1}}
.hist{display:grid;gap:4px;font-size:12.5px}

/* issues */
.issue{display:grid;gap:4px;padding:10px 12px;border-radius:9px;background:var(--sunk);border-left:4px solid var(--warn)}
.issue.done{border-left-color:var(--ok);opacity:.8}
.issue .i-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.issue .eq{font-size:12px;font-weight:700;color:var(--warn)}
.issue.done .eq{color:var(--ok)}
.issue .txt{white-space:pre-wrap}
.issue .s{font-size:12px;color:var(--muted)}
.issue .i-act{display:flex;gap:6px;flex-wrap:wrap}
.form{display:grid;gap:8px}
.form .r{display:flex;gap:8px;flex-wrap:wrap}
.form .r>*{flex:1 1 160px}

/* settings */
.tset{display:grid;grid-template-columns:minmax(140px,1.4fr) 110px 100px minmax(160px,2fr) auto;gap:8px;align-items:start;padding:8px;border-radius:8px;background:var(--sunk)}
.tset label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
.tset textarea{min-height:36px}
@media (max-width:760px){.tset{grid-template-columns:1fr 1fr}.tset .f-g,.tset .f-n{grid-column:1/-1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.two label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.two textarea{min-height:150px;font-weight:400;color:var(--ink);line-height:1.7}

/* setup */
.boot{color:var(--muted);padding:40px 0;text-align:center}
.setup{max-width:520px;width:100%;margin:32px auto;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.setup h1{margin:0;font-size:20px}
.setup p{margin:0;color:var(--muted);font-size:13px}
.setup-f{display:grid;gap:6px}
.setup-f label{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.setup-f input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;width:100%}
.setup-f button{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="boot">불러오는 중…</p></div>
<script>
(function(){
"use strict";
var WD=["일","월","화","수","목","금","토"];
var KINDS=["개관","마감"];
var DEF={
  tasks:[
    {id:"greenby",name:"그린바이 물갈이",type:"주기",every:"7",warn:"",guide:"",link:""},
    {id:"helpbot",name:"헬프로봇 번호 정리",type:"필요시",every:"",warn:"",guide:"",link:""},
    {id:"mlsort",name:"머신러닝 카드 재분류",type:"필요시",every:"",warn:"",guide:"",link:""},
    {id:"mlmake",name:"머신러닝 카드 만들기",type:"필요시",every:"",warn:"",guide:"",link:""},
    {id:"stock",name:"재고 조사",type:"주기",every:"30",warn:"",guide:"재고 탭에서 수량을 확인하고 ‘재고 조사 완료’를 누르면 기록돼요.",link:"stock"}
  ],
  items:[
    {id:"worksheet",name:"되살리다 활동지",unit:"장",qty:"",min:"",place:""},
    {id:"plant",name:"그린바이 식물",unit:"개",qty:"",min:"",place:""}
  ],
  checkItems:{
    "개관":["조명·전원 켜기","헬프로봇 전원·충전 확인","활동지·재료 비치","그린바이 상태 확인","공간 정리 상태 확인"],
    "마감":["기기 전원 끄기","헬프로봇 충전 거치","재료 정리·수량 확인","바닥·쓰레기 정리","조명 소등·문단속"]
  }
};
var LISTS=["tasks","logs","items","stockLogs","issues","checkItems","checks"];

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n}
function keyOf(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function dateOf(k){return new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8))}
function addDays(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
function diff(a,b){return Math.round((dateOf(b)-dateOf(a))/86400000)}
function md(k){var d=dateOf(k);return (d.getMonth()+1)+"/"+d.getDate()+" ("+WD[d.getDay()]+")"}
function hm(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
var TODAY=keyOf(new Date());
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rid(){return Math.random().toString(36).slice(2,9)}
function num(v){return v===""||v==null||isNaN(+v)?null:+v}
function byId(L,id){for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null}

/* ---------- state ---------- */
var S={},CLOSED={};
function norm(s){S=s||{};LISTS.forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]})}
norm({});
function isClosed(k){if(typeof CLOSED[k]==="boolean")return CLOSED[k];return dateOf(k).getDay()===1}
function nextOpen(k){for(var i=0;i<14&&isClosed(k);i++)k=addDays(k,1);return k}
function checkLabels(kind){return S.checkItems.filter(function(c){return c.kind===kind}).map(function(c){return c.label})}

/* every change is an op: applied now, and re-applied on top of the latest sheet
   if someone else saved first — so two people on their phones don't overwrite each other */
function upsert(L,o){var x=byId(L,o.id);if(x){Object.keys(o).forEach(function(k){x[k]=o[k]})}else L.push(JSON.parse(JSON.stringify(o)))}
function apply(op){
  switch(op.t){
    case "seed":
      if(S.seeded)break;
      if(!S.tasks.length)S.tasks=JSON.parse(JSON.stringify(DEF.tasks));
      if(!S.items.length)S.items=JSON.parse(JSON.stringify(DEF.items));
      if(!S.checkItems.length)KINDS.forEach(function(k){DEF.checkItems[k].forEach(function(l){S.checkItems.push({kind:k,label:l})})});
      S.seeded=true;break;
    case "log":upsert(S.logs,op.log);break;
    case "unlog":S.logs=S.logs.filter(function(l){return l.id!==op.id});break;
    case "task":upsert(S.tasks,op.task);break;
    case "untask":S.tasks=S.tasks.filter(function(t){return t.id!==op.id});break;
    case "item":upsert(S.items,op.item);break;
    case "unitem":S.items=S.items.filter(function(t){return t.id!==op.id});break;
    case "issue":upsert(S.issues,op.issue);break;
    case "unissue":S.issues=S.issues.filter(function(t){return t.id!==op.id});break;
    case "check":
      S.checks=S.checks.filter(function(c){return !(c.date===op.date&&c.kind===op.kind&&op.labels.indexOf(c.label)>=0)});
      if(op.on)op.labels.forEach(function(l){S.checks.push({date:op.date,kind:op.kind,label:l,by:op.by,time:op.time})});
      break;
    case "checklist":
      S.checkItems=S.checkItems.filter(function(c){return c.kind!==op.kind}).concat(op.labels.map(function(l){return {kind:op.kind,label:l}}));break;
    case "survey":
      if(byId(S.stockLogs,op.id+"-0"))break;
      S.items.forEach(function(it,i){it.date=op.date;it.by=op.by;S.stockLogs.push({id:op.id+"-"+i,date:op.date,item:it.id,itemName:it.name,qty:it.qty,by:op.by,memo:"재고 조사"})});
      var st=S.tasks.filter(function(t){return t.link==="stock"})[0];
      if(st)upsert(S.logs,{id:op.id,date:op.date,task:st.id,taskName:st.name,by:op.by,memo:""});
      break;
  }
}

/* ---------- who ---------- */
var ME="";try{ME=localStorage.getItem("raim-name")||""}catch(e){}
function me(force){
  if(ME&&!force)return ME;
  var n=window.prompt("기록에 남길 이름을 입력해 주세요. 이 기기에 저장돼요.",ME||"");
  if(n==null)return force?ME:null;n=n.trim();if(!n)return force?ME:null;
  ME=n;try{localStorage.setItem("raim-name",ME)}catch(e){}
  return ME;
}

/* ---------- sync ---------- */
var API=null;try{API=JSON.parse(localStorage.getItem("raim-api")||"null")}catch(e){}
var VERSION=0,pending=[],saveState="idle",saveTimer=null,inflight=false,loaded=false,retries=0;
function saveHTML(){
  var t={idle:"시트에 저장됨",pending:"저장 대기",saving:"저장 중…",error:"저장 실패 · 연결을 확인하세요"}[saveState]||"";
  return '<span class="save" id="save" data-s="'+saveState+'" role="status"><i></i>'+t+(saveState==="error"?' <button type="button" data-act="savenow">다시 저장</button>':'')+'</span>';
}
function setSave(s){saveState=s;var el=document.getElementById("save");if(el)el.outerHTML=saveHTML()}
function dispatch(op){apply(op);pending.push(op);setSave("pending");clearTimeout(saveTimer);saveTimer=setTimeout(save,800);render()}
function post(){return fetch(API.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:API.token,board:"atelier",action:"save",baseVersion:VERSION,state:S})}).then(function(r){return r.json()})}
function fetchState(){
  var u=API.url+(API.url.indexOf("?")<0?"?":"&")+"action=load&board=atelier&token="+encodeURIComponent(API.token);
  return fetch(u).then(function(r){return r.json()});
}
function save(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!API||!loaded||!pending.length)return;
  if(inflight){saveTimer=setTimeout(save,500);return}
  inflight=true;setSave("saving");
  var sent=pending.length;
  post().then(function(res){
    if(res&&res.ok){inflight=false;VERSION=res.version;pending.splice(0,sent);retries=0;if(pending.length)save();else setSave("idle");return}
    if(res&&res.code==="conflict"&&retries<4){
      // someone else saved first: take their version, replay our changes on top, try again
      retries++;
      return fetchState().then(function(r2){
        inflight=false;
        if(!r2||!r2.ok||r2.board!=="atelier"){setSave("error");return}
        norm(r2.state);CLOSED=r2.closed||{};VERSION=r2.version||0;
        pending.forEach(apply);render();save();
      });
    }
    inflight=false;

var ORDER={late:0,today:1,flag:2,soon:3,warn:4,done:5,ok:6};
function taskInfo(t){
  var logs=S.logs.filter(function(l){return l.task===t.id}).sort(function(a,b){return a.date<b.date?-1:1});
  var last=logs.length?logs[logs.length-1]:null,todayLog=logs.filter(function(l){return l.date===TODAY}).pop()||null;
  var o={t:t,last:last,todayLog:todayLog,s:"ok",txt:""};
  if(t.type==="주기"){
    var every=num(t.every)||7;
    o.due=nextOpen(last?addDays(last.date,every):TODAY);
    var dd=diff(TODAY,o.due);
    if(todayLog){o.s="done";o.txt="다음 "+md(o.due)}
    else if(dd<0){o.s="late";o.txt=(-dd)+"일 지남 · 예정 "+md(o.due)}
    else if(dd===0){o.s="today";o.txt="오늘 할 차례"}
    else if(dd<=2){o.s="soon";o.txt="D-"+dd+" · "+md(o.due)}
    else o.txt="다음 "+md(o.due)+" · D-"+dd;
    o.pill={late:"밀림",today:"오늘",soon:"곧",done:"오늘 완료",ok:every+"일마다"}[o.s];
  }else{
    var since=last?diff(last.date,TODAY):null,warn=num(t.warn);
    if(todayLog)o.s="done";
    else if(t.flagDate)o.s="flag";
    else if(warn!=null&&(since==null||since>=warn))o.s="warn";
    o.txt=since==null?"아직 기록 없음":since===0?"오늘 함":"마지막 "+since+"일 전 · "+md(last.date);
    o.pill={done:"오늘 완료",flag:"필요해요",warn:"점검 권장",ok:"필요할 때"}[o.s];
  }
  return o;
}
function infos(){return S.tasks.map(taskInfo).sort(function(a,b){return ORDER[a.s]-ORDER[b.s]})}
function lowItems(){return S.items.filter(function(i){var q=num(i.qty),m=num(i.min);return m!=null&&q!=null&&q<=m})}
function openIssues(){return S.issues.filter(function(i){return i.status!=="해결"})}
function checkOf(date,kind,label){for(var i=0;i<S.checks.length;i++){var c=S.checks[i];if(c.date===date&&c.kind===kind&&c.label===label)return c}return null}
function checkCount(date,kind){var L=checkLabels(kind);return {n:L.filter(function(l){return checkOf(date,kind,l)}).length,of:L.length}}

/* calendar: done (green), planned (dashed, projected for 주기 tasks), issue (orange) */
function planned(fromK,toK){
  var out={};
  S.tasks.forEach(function(t){
    if(t.type!=="주기")return;var o=taskInfo(t),every=num(t.every)||7;
    var k=o.due;
    if(k<TODAY){if(k>=fromK&&k<=toK)(out[k]=out[k]||[]).push({t:t,late:true});k=nextOpen(addDays(TODAY,every))}
    for(var i=0;i<60&&k<=toK;i++){
      if(k>=fromK)(out[k]=out[k]||[]).push({t:t,late:false});
      k=nextOpen(addDays(k,every));
    }
  });
  return out;
}

function issuesHTML(){
  var eqs={};["헬프로봇","그린바이","머신러닝 키트"].concat(S.issues.map(function(i){return i.equip})).forEach(function(e){if(e)eqs[e]=1});
  var h='<section class="card"><h2>장비 이슈 등록</h2><form id="addissue" class="form"><div class="r"><input type="text" id="is-eq" list="eqlist" placeholder="장비 (예: 헬프로봇)"><datalist id="eqlist">'+Object.keys(eqs).map(function(e){return '<option value="'+esc(e)+'">'}).join("")+'</datalist></div><textarea id="is-txt" placeholder="어떤 문제인지 (예: 3번 헬프로봇 바퀴가 헛돎)" required></textarea><div class="addrow"><button type="submit" class="btn primary">등록</button></div></form></section>';
  var op=openIssues().sort(function(a,b){return a.date<b.date?-1:1}),dn=S.issues.filter(function(i){return i.status==="해결"}).sort(function(a,b){return (a.doneDate||"")<(b.doneDate||"")?1:-1});
  h+='<section class="card"><h2>해결 안 됨 <small>'+op.length+'건</small></h2>'+(op.length?op.map(issueHTML).join(""):'<p class="empty">없어요.</p>')+'</section>';
  if(dn.length)h+='<section class="card"><details><summary><b>해결됨</b> <span class="muted">'+dn.length+'건</span></summary><div class="stack" style="gap:8px;margin-top:10px">'+dn.slice(0,30).map(issueHTML).join("")+'</div></details></section>';
  return h;
}
function issueHTML(x){
  var done=x.status==="해결";
  var h='<div class="issue'+(done?" done":"")+'"><div class="i-h">'+(x.equip?'<span class="eq">'+esc(x.equip)+'</span>':'')+'<span class="s">'+md(x.date)+' · '+esc(x.by||"")+(done?'':' · '+diff(x.date,TODAY)+'일째')+'</span></div><div class="txt">'+esc(x.text)+'</div>';
  if(done)h+='<div class="s">해결 '+md(x.doneDate)+' · '+esc(x.doneBy||"")+(x.doneNote?' — '+esc(x.doneNote):'')+'</div>';
  h+='<div class="i-act">'+(done?'<button type="button" class="btn ghost" data-act="reopen" data-id="'+x.id+'">다시 열기</button>':'<button type="button" class="btn ok" data-act="resolve" data-id="'+x.id+'">해결됨</button>')+'<button type="button" class="btn ghost'+(armed===x.id?" arm":"")+'" data-act="unissue" data-id="'+x.id+'">'+(armed===x.id?"삭제 확인":"삭제")+'</button></div>';
  return h+'</div>';
}

function settingsHTML(){
  var h='<section class="card"><h2>루틴 업무 <small>주기: 마지막으로 한 날부터 N일 뒤 (휴관일이면 다음 운영일) · 필요시: 알림(일)을 넣으면 그만큼 지나면 ‘점검 권장’</small></h2><div class="stack" style="gap:6px">';
  S.tasks.forEach(function(t){
    var cyc=t.type==="주기";
    h+='<div class="tset"><label class="f-n">업무<input type="text" id="tn-'+t.id+'" data-act="taskf" data-f="name" data-id="'+t.id+'" value="'+esc(t.name)+'"></label>';
    h+='<label>종류<select id="tt-'+t.id+'" data-act="taskf" data-f="type" data-id="'+t.id+'"><option'+(cyc?" selected":"")+'>주기</option><option'+(cyc?"":" selected")+'>필요시</option></select></label>';
    h+=cyc?'<label>주기(일)<input type="number" min="1" id="te-'+t.id+'" data-act="taskf" data-f="every" data-id="'+t.id+'" value="'+esc(t.every)+'" placeholder="7"></label>':'<label>알림(일)<input type="number" min="1" id="tw-'+t.id+'" data-act="taskf" data-f="warn" data-id="'+t.id+'" value="'+esc(t.warn)+'" placeholder="없음"></label>';
    h+='<label class="f-g">방법 메모<textarea id="tg-'+t.id+'" data-act="taskf" data-f="guide" data-id="'+t.id+'" placeholder="순서, 주의할 점 (선택)">'+esc(t.guide)+'</textarea></label>';
    h+='<button type="button" class="btn ghost'+(armed===t.id?" arm":"")+'" data-act="untask" data-id="'+t.id+'" style="align-self:end">'+(armed===t.id?"삭제 확인":"삭제")+'</button></div>';
  });
  h+='</div><div class="addrow"><button type="button" class="btn" data-act="addtask">업무 추가</button></div></section>';
  h+='<section class="card"><h2>점검 항목 <small>한 줄에 하나 · 순서대로 보여요</small></h2><div class="two">'+KINDS.map(function(k){return '<label>'+k+' 점검<textarea id="cl-'+k+'" data-act="checklist" data-k="'+k+'">'+esc(checkLabels(k).join("\n"))+'</textarea></label>'}).join("")+'</div></section>';
  h+='<section class="card"><h2>이 기기</h2><div class="addrow"><button type="button" class="btn" data-act="me">기록자 이름 바꾸기'+(ME?' ('+esc(ME)+')':'')+'</button><button type="button" class="btn" data-act="setup">연결 설정</button></div></section>';
  return h;
}

/* ---------- events ---------- */
var app=document.getElementById("app");
function withMe(fn){var who=me();if(who)fn(who)}
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act,id=t.dataset.id;
  if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")return;
  if(a==="tab"){UI.tab=t.dataset.v;keepUI();armed=null;render();window.scrollTo(0,0);try{history.replaceState(null,"","#"+UI.tab)}catch(x){}return}
  if(a==="me"){me(true);render();return}
  if(a==="setup"){if(pending.length)save();showSetup();return}
  if(a==="savenow"){retries=0;save();return}
  if(a==="sel"){UI.sel=t.dataset.k;keepUI();render();return}
  if(a==="mon"){var m=UI.vm+(+t.dataset.d),y=UI.vy;if(m<0){m=11;y--}if(m>11){m=0;y++}UI.vm=m;UI.vy=y;keepUI();render();return}
  if(a==="done"){withMe(function(who){var tk=byId(S.tasks,id);dispatch({t:"log",log:{id:rid(),date:TODAY,task:id,taskName:tk.name,by:who,memo:""}});if(tk.flagDate)dispatch({t:"task",task:{id:id,flagDate:"",flagBy:"",flagMemo:""}})});return}
  if(a==="unlog"){if(t.dataset.confirm&&armed!==id){arm(id);render();return}armed=null;dispatch({t:"unlog",id:id});return}
  if(a==="memo"){var lg=byId(S.logs,id);if(!lg)return;var mm=window.prompt("메모 (예: 카드 20장, 물 반만 갈았음)",lg.memo||"");if(mm==null)return;dispatch({t:"log",log:{id:id,memo:mm.trim()}});return}
  if(a==="flag"){var tf=byId(S.tasks,id);if(!tf)return;
    if(tf.flagDate){dispatch({t:"task",task:{id:id,flagDate:"",flagBy:"",flagMemo:""}});return}
    withMe(function(who){var note=window.prompt("왜 필요해 보이나요? (선택, 비워도 돼요)","");if(note==null)return;dispatch({t:"task",task:{id:id,flagDate:TODAY,flagBy:who,flagMemo:note.trim()}})});return}
  if(a==="addlog"){var sel=document.getElementById("addlog");if(!sel)return;var tk2=byId(S.tasks,sel.value);if(!tk2)return;withMe(function(who){dispatch({t:"log",log:{id:rid(),date:t.dataset.k,task:tk2.id,taskName:tk2.name,by:who,memo:""}})});return}
  if(a==="checkall"){var L=checkLabels(t.dataset.k).filter(function(l){return !checkOf(t.dataset.d,t.dataset.k,l)});withMe(function(who){dispatch({t:"check",date:t.dataset.d,kind:t.dataset.k,labels:L,on:true,by:who,time:hm()})});return}
  if(a==="qty"){var it=byId(S.items,id);if(!it)return;var q=Math.max(0,(num(it.qty)||0)+(+t.dataset.d));dispatch({t:"item",item:{id:id,qty:String(q)}});return}
  if(a==="survey"){withMe(function(who){if(!window.confirm("지금 수량으로 오늘("+md(TODAY)+") 재고 조사를 기록할까요?"))return;dispatch({t:"survey",id:rid(),date:TODAY,by:who})});return}
  if(a==="copylow"){var txt="[아뜰리에 재고 부족 "+md(TODAY)+"]\n"+lowItems().map(function(i){return "- "+i.name+": "+i.qty+i.unit+" 남음 (기준 "+i.min+i.unit+")"}).join("\n");
    var ok=function(){t.textContent="복사됨";setTimeout(render,1500)};try{navigator.clipboard.writeText(txt).then(ok,function(){window.prompt("복사해서 쓰세요",txt)})}catch(x){window.prompt("복사해서 쓰세요",txt)}return}
  if(a==="unitem"||a==="untask"||a==="unissue"){if(armed!==id){arm(id);render();return}armed=null;dispatch({t:a,id:id});return}
  if(a==="resolve"){withMe(function(who){var n=window.prompt("어떻게 해결했나요? (선택)","");if(n==null)return;dispatch({t:"issue",issue:{id:id,status:"해결",doneDate:TODAY,doneBy:who,doneNote:n.trim()}})});return}
  if(a==="reopen"){dispatch({t:"issue",issue:{id:id,status:"진행중",doneDate:"",doneBy:"",doneNote:""}});return}
  if(a==="addtask"){var nid=rid();dispatch({t:"task",task:{id:nid,name:"새 업무",type:"필요시",every:"",warn:"",guide:"",link:"",flagDate:"",flagBy:"",flagMemo:""}});var el=document.getElementById("tn-"+nid);if(el){el.focus();el.select()}return}
});
app.addEventListener("change",function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==="check"){
    var label=checkLabels(t.dataset.k)[+t.dataset.i],on=t.checked;
    if(on){var who=me();if(!who){t.checked=false;return}dispatch({t:"check",date:t.dataset.d,kind:t.dataset.k,labels:[label],on:true,by:who,time:hm()})}
    else dispatch({t:"check",date:t.dataset.d,kind:t.dataset.k,labels:[label],on:false});
    return;
  }
  if(a==="itemf"){var v=t.value.trim();if(t.dataset.f==="name"&&!v){render();return}var o={id:t.dataset.id};o[t.dataset.f]=v;dispatch({t:"item",item:o});return}
  if(a==="taskf"){var v2=t.value.trim();if(t.dataset.f==="name"&&!v2){render();return}var o2={id:t.dataset.id};o2[t.dataset.f]=v2;if(t.dataset.f==="type"&&v2==="주기"){var tk=byId(S.tasks,t.dataset.id);if(tk&&!num(tk.every))o2.every="7"}dispatch({t:"task",task:o2});return}
  if(a==="checklist"){var seen={};var labels=t.value.split("\n").map(function(x){return x.trim()}).filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true});dispatch({t:"checklist",kind:t.dataset.k,labels:labels});return}
});
app.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="setupform"){API={url:document.getElementById("su-url").value.trim(),token:document.getElementById("su-token").value.trim()};try{localStorage.setItem("raim-api",JSON.stringify(API))}catch(x){}app.innerHTML='<p class="boot">불러오는 중…</p>';load();return}
  if(f.id==="additem"){var n=document.getElementById("ni-name").value.trim();if(!n)return;dispatch({t:"item",item:{id:rid(),name:n,unit:document.getElementById("ni-unit").value.trim(),qty:"",min:"",place:"",date:"",by:""}});return}
  if(f.id==="addissue"){var txt=document.getElementById("is-txt").value.trim();if(!txt)return;var eq=document.getElementById("is-eq").value.trim();withMe(function(who){dispatch({t:"issue",issue:{id:rid(),date:TODAY,equip:eq,text:txt,by:who,status:"진행중",doneDate:"",doneBy:"",doneNote:""}})});return}
});
setInterval(function(){var k=keyOf(new Date());if(k!==TODAY){TODAY=k;render()}},60000);
load();
})();
</script>
</body>
</html>
