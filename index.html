<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RAIM 업무 대시보드</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"><style>
:root{color-scheme:light;
  --bg:#F4F6FA;--surface:#FFFFFF;--sunk:#E9EDF4;--ink:#16203A;--muted:#5C6780;--line:#D9DFEA;
  --accent:#2450D6;--accent-ink:#FFFFFF;--accent-soft:#E4EAFB;
  --danger:#C23A2E;--danger-soft:#FBE8E5;--warn:#9A5B00;--warn-soft:#FFF1D6;--ok:#1C7447;--ok-soft:#E1F2E8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;justify-content:space-between}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.boards{grid-template-columns:1fr}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bh h2{margin:0;font-size:17px}
.open{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:8px;padding:7px 14px;font-weight:500;font-size:13px;white-space:nowrap}
.desc{margin:0;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:9px;padding:10px 12px;display:grid;gap:2px;text-decoration:none;color:inherit}
.stat b{font-family:var(--mono);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot{background:var(--danger-soft)}.stat.hot b{color:var(--danger)}
.stat.good b{color:var(--ok)}
.todo{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.todo li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 10px;border-radius:7px;background:var(--sunk)}
.todo li span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.todo li.hot span:last-child{color:var(--danger);font-weight:500}
.note{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.boot{color:var(--muted);padding:40px 0;text-align:center}
.setup{max-width:520px;width:100%;margin:32px auto;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.setup h1{margin:0;font-size:20px}
.setup p{margin:0;color:var(--muted);font-size:13px}
.setup-f{display:grid;gap:6px}
.setup-f label{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.setup-f input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:500;margin-top:10px}
</style>
</head>
<body>
<div id="app"><p class="boot">불러오는 중…</p></div>
<script>
(function(){
"use strict";
var WD=["일","월","화","수","목","금","토"];
function pad(n){return (n<10?"0":"")+n}
function keyOf(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function dateOf(k){return new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8))}
function addDays(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
function diff(a,b){return Math.round((dateOf(b)-dateOf(a))/86400000)}
function md(k){var d=dateOf(k);return (d.getMonth()+1)+"/"+d.getDate()+" ("+WD[d.getDay()]+")"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){return v===""||v==null||isNaN(+v)?null:+v}
var TODAY=keyOf(new Date());

var API=null;try{API=JSON.parse(localStorage.getItem("raim-api")||"null")}catch(e){}
function get(board){
  var u=API.url+(API.url.indexOf("?")<0?"?":"&")+"action=load&token="+encodeURIComponent(API.token)+(board?"&board="+board:"");
  return fetch(u).then(function(r){return r.json()}).catch(function(){return {ok:false,code:"net"}});
}

/* ---------- 자원봉사 ---------- */
function volSummary(res){
  var days=(res.state&&res.state.days)||{};
  function closed(k){var d=days[k];if(d&&typeof d.closed==="boolean")return d.closed;return dateOf(k).getDay()===1}
  var t=days[TODAY],todayN=(t&&!closed(TODAY))?t.vols.length:0,noAtt=0,entry=0;
  Object.keys(days).forEach(function(k){
    if(closed(k))return;var d=days[k];
    (d.vols||[]).forEach(function(v){if(k<=TODAY&&v.attend==null)noAtt++;if(v.attend==="o"&&!v.entered)entry++});
  });
  return {todayN:todayN,closedToday:closed(TODAY),noAtt:noAtt,entry:entry};
}
function volHTML(res){
  var h='<section class="board"><div class="bh"><h2>자원봉사 보드</h2><a class="open" href="volunteer/">열기 →</a></div><p class="desc">1365 명단 확인 · 배치 · 출석 · 실적 입력</p>';
  if(!res.ok)return h+'<p class="note">불러오지 못했어요.</p></section>';
  var s=volSummary(res);
  h+='<div class="stats"><a class="stat" href="volunteer/"><b>'+(s.closedToday?"휴관":s.todayN)+'</b><span>오늘 봉사자</span></a>';
  h+='<a class="stat'+(s.noAtt?" hot":" good")+'" href="volunteer/"><b>'+s.noAtt+'</b><span>출석 표시 필요</span></a>';
  h+='<a class="stat'+(s.entry?" hot":" good")+'" href="volunteer/"><b>'+s.entry+'</b><span>1365 입력 대기</span></a></div>';
  return h+'</section>';
}

/* ---------- 아뜰리에 ---------- */
function atSummary(res){
  var s=res.state||{},C=res.closed||{};
  function closed(k){if(typeof C[k]==="boolean")return C[k];return dateOf(k).getDay()===1}
  function nextOpen(k){for(var i=0;i<14&&closed(k);i++)k=addDays(k,1);return k}
  var logs=s.logs||[],todo=[];
  (s.tasks||[]).forEach(function(t){
    var L=logs.filter(function(l){return l.task===t.id}).map(function(l){return l.date}).sort(),last=L[L.length-1];
    if(L.indexOf(TODAY)>=0)return;
    if(t.flagDate){todo.push({name:t.name,txt:"필요해요",hot:true});return}
    if(t.type==="주기"){
      var due=nextOpen(last?addDays(last,num(t.every)||7):TODAY),dd=diff(TODAY,due);
      if(dd<0)todo.push({name:t.name,txt:(-dd)+"일 지남",hot:true});
      else if(dd===0)todo.push({name:t.name,txt:"오늘",hot:true});
      else if(dd<=2)todo.push({name:t.name,txt:"D-"+dd});
    }else{
      var w=num(t.warn);if(w!=null&&(!last||diff(last,TODAY)>=w))todo.push({name:t.name,txt:"점검 권장"});
    }
  });
  var low=(s.items||[]).filter(function(i){var q=num(i.qty),m=num(i.min);return m!=null&&q!=null&&q<=m});
  var issues=(s.issues||[]).filter(function(i){return i.status!=="해결"});
  var items=s.checkItems||[],checks=(s.checks||[]).filter(function(c){return c.date===TODAY});
  var ck=items.filter(function(it){return checks.some(function(c){return c.kind===it.kind&&c.label===it.label})}).length;
  return {todo:todo,low:low,issues:issues,ck:ck,ckOf:items.length,closedToday:closed(TODAY)};
}
function atHTML(res){
  var h='<section class="board"><div class="bh"><h2>아뜰리에 관리 보드</h2><a class="open" href="atelier/">열기 →</a></div><p class="desc">루틴 업무 · 개관/마감 점검 · 재고 · 장비 이슈</p>';
  if(res.ok&&res.board!=="atelier")return h+'<div class="banner">Apps Script를 새 버전으로 바꿔야 아뜰리에 보드를 쓸 수 있어요. 저장소의 <b>apps-script</b> 폴더를 참고하세요.</div></section>';
  if(!res.ok)return h+'<p class="note">불러오지 못했어요.</p></section>';
  var s=atSummary(res),hot=s.todo.filter(function(t){return t.hot}).length;
  h+='<div class="stats"><a class="stat'+(hot?" hot":" good")+'" href="atelier/#today"><b>'+hot+'</b><span>오늘 할 루틴</span></a>';
  h+='<a class="stat'+(s.closedToday?"":s.ck<s.ckOf?"":" good")+'" href="atelier/#today"><b>'+(s.closedToday?"휴관":s.ck+"/"+s.ckOf)+'</b><span>오늘 점검</span></a>';
  h+='<a class="stat'+(s.low.length?" hot":" good")+'" href="atelier/#stock"><b>'+s.low.length+'</b><span>재고 부족</span></a>';
  h+='<a class="stat'+(s.issues.length?" hot":" good")+'" href="atelier/#issues"><b>'+s.issues.length+'</b><span>장비 이슈</span></a></div>';
  var rows=s.todo.map(function(t){return '<li class="'+(t.hot?"hot":"")+'"><span>'+esc(t.name)+'</span><span>'+esc(t.txt)+'</span></li>'})
    .concat(s.low.map(function(i){return '<li class="hot"><span>재고: '+esc(i.name)+'</span><span>'+esc(i.qty)+esc(i.unit)+' 남음</span></li>'}))
    .concat(s.issues.slice(0,3).map(function(i){return '<li><span>'+(i.equip?'['+esc(i.equip)+'] ':'')+esc(i.text)+'</span><span>'+diff(i.date,TODAY)+'일째</span></li>'}));
  if(rows.length)h+='<ul class="todo">'+rows.join("")+'</ul>';
  return h+'</section>';
}

function render(v,a){
  var h='<header class="top"><h1>RAIM 업무 대시보드<small>'+md(TODAY)+' · 오늘 챙길 일</small></h1><button type="button" class="linkbtn" data-act="setup">연결 설정</button></header>';
  if(v.code==="auth"||a.code==="auth"){showSetup("접속 코드가 맞지 않아요.");return}
  if(!v.ok&&!a.ok)h+='<div class="banner">웹앱에 연결하지 못했어요. 연결 설정을 확인해 주세요.</div>';
  h+='<div class="boards">'+volHTML(v)+atHTML(a)+'</div>';
  document.getElementById("app").innerHTML=h;
}
function showSetup(msg){
  var a=API||{url:"",token:""};
  document.getElementById("app").innerHTML='<div class="setup"><h1>RAIM 업무 대시보드 연결</h1><p>구글 시트에 배포한 웹앱 주소와 접속 코드를 넣어주세요. 이 브라우저에만 저장되고, 자원봉사·아뜰리에 보드에도 같이 적용돼요.</p>'+(msg?'<div class="banner">'+esc(msg)+'</div>':'')+'<form id="setupform" class="setup-f" autocomplete="off"><label for="su-url">웹앱 주소</label><input id="su-url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(a.url)+'"><label for="su-token">접속 코드</label><input id="su-token" type="text" required value="'+esc(a.token)+'"><button type="submit" class="btn">연결</button></form></div>';
}
function load(){
  if(!API){showSetup();return}
  Promise.all([get(""),get("atelier")]).then(function(r){render(r[0],r[1])});
}
document.addEventListener("click",function(e){var t=e.target.closest("[data-act=setup]");if(t)showSetup()});
document.addEventListener("submit",function(e){
  if(e.target.id!=="setupform")return;e.preventDefault();
  API={url:document.getElementById("su-url").value.trim(),token:document.getElementById("su-token").value.trim()};
  try{localStorage.setItem("raim-api",JSON.stringify(API))}catch(x){}
  document.getElementById("app").innerHTML='<p class="boot">불러오는 중…</p>';load();
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&API)load()});
load();
})();
</script>
</body>
</html>
